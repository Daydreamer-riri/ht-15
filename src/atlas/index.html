<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f27"><title>北疆星球 · RealTrip</title><meta name="description" content="把七天的北疆自驾收进一座小小星球。旋转沙盘、切换日期，看见完整行程。"><meta property="og:title" content="北疆星球 · RealTrip"><meta property="og:description" content="7 天，2,908 公里，9 个地点。"><meta property="og:image" content="https://dimg04.c-ctrip.com/images/0105212000a2cvssuAE2B_C_960_640.jpg"><link rel="icon" type="image/svg+xml" href="./assets/mark.svg"><link rel="preconnect" href="https://dimg04.c-ctrip.com"><link rel="stylesheet" href="./ENTRY.bundle.css"></head>
<body data-trip="xinjiang"><main id="app">
<header class="topbar" data-rise style="--d:150"><a class="brand" href="../walk/">RealTrip</a><nav class="trip-nav" aria-label="选择旅行星球"><a data-trip-link="xinjiang" href="../route-3d/">北疆七日</a><a data-trip-link="soho" href="../sky-soho/">一日游</a><a href="../walk/">实景漫游</a></nav><div class="header-tools"><button id="about" class="icon-btn" aria-label="查看场景与数据说明"><i data-icon="info"></i></button><button id="fullscreen" class="icon-btn" aria-label="全屏浏览"><i data-icon="expand"></i></button></div></header>
<section class="hero" aria-labelledby="hero-title"><h1 id="hero-title" class="display" data-rise style="--d:350">北疆星球</h1><p id="hero-copy" class="lead" data-rise style="--d:550"></p></section>
<div id="scene" class="scene-host"></div>
<div class="scene-controls" data-rise style="--d:2400"><div class="segmented" role="group" aria-label="切换沙盘视角"><button data-view="planet" aria-pressed="true">星球</button><button data-view="top" aria-pressed="false">俯瞰</button></div><div class="toolbar" role="group" aria-label="沙盘工具"><button id="rotate" class="icon-btn" aria-pressed="false" aria-label="自动旋转" title="自动旋转"><i data-icon="rotate"></i></button><button id="zoom-in" class="icon-btn" aria-label="放大沙盘"><i data-icon="plus"></i></button><button id="zoom-out" class="icon-btn" aria-label="缩小沙盘"><i data-icon="minus"></i></button><button id="reset" class="icon-btn" aria-label="回到全程沙盘" title="全程沙盘"><i data-icon="home"></i></button><button id="light" class="icon-btn" aria-label="切换日落光照" aria-pressed="false"><i data-icon="sun"></i></button><button id="snapshot" class="icon-btn" aria-label="保存沙盘图片"><i data-icon="camera"></i></button></div><p class="small gesture-hint" id="gesture-hint">拖动旋转，双指缩放，点地名查看</p></div>
<button class="btn btn-primary peek-detail" id="peek-detail" hidden>查看详情</button>
<aside class="sheet" id="sheet" aria-label="行程" data-rise style="--d:2700">
  <button class="sheet-handle" id="sheet-handle" aria-expanded="false" aria-controls="sheet-body"><span aria-hidden="true"></span><span class="sr-only">展开行程面板</span></button>
  <nav id="day-tabs" class="day-tabs" aria-label="选择行程日期"></nav>
  <div class="sheet-body" id="sheet-body">
    <article class="detail" id="detail" aria-live="polite">
      <figure class="detail-photo"><img id="detail-photo" alt="" width="960" height="640" hidden></figure>
      <div class="detail-copy">
        <h2 class="head" id="detail-title">山河，尽收眼底</h2>
        <p class="small" id="detail-meta"></p>
        <p id="detail-copy"></p>
        <div class="detail-actions"><button class="btn" id="prev-stop" aria-label="上一站"><i data-icon="prev"></i></button><button class="btn" id="next-stop" aria-label="下一站"><i data-icon="next"></i></button><button class="btn" id="place-details">地点详情</button></div>
        <p class="small detail-credit" id="detail-credit" hidden>照片来自原行程</p>
      </div>
    </article>
    <section class="stops-wrap" aria-label="行程地点"><h2 class="small stops-title" id="rail-caption">七天的远方</h2><nav id="stops" class="stops" aria-label="选择行程地点"></nav></section>
    <section class="route-panel" id="route-panel" aria-labelledby="route-selected"><h2 class="small" id="route-selected">全部路线</h2><svg id="route-map" viewBox="0 0 250 152" role="img" aria-label="原行程完整路线图"></svg><p class="small" id="route-meta"></p></section>
    <p class="small source-line"><button id="source">原始路线与艺术化场景说明</button></p>
  </div>
</aside>
<button id="route-toggle" hidden aria-expanded="false" aria-controls="route-panel">全程线路</button>
<button id="extras" hidden>待安排与返程</button>
<div id="loading" class="loader" role="status">正在收藏一座星球…</div><div id="toast" role="status" hidden></div><noscript>请启用 JavaScript 以体验三维沙盘。</noscript></main>
<dialog id="place-dialog"><button data-close class="icon-btn" aria-label="关闭地点详情"><i data-icon="close"></i></button><h2 class="head" id="place-dialog-title"></h2><p id="place-dialog-copy"></p><p class="small" id="place-dialog-meta"></p><p class="small" id="place-dialog-coords"></p></dialog>
<dialog id="about-dialog"><button data-close class="icon-btn" aria-label="关闭场景说明"><i data-icon="close"></i></button><h2 class="head">路线有据，风景有想象。</h2><p id="source-copy"></p><p>点选地点会高亮位置和行程信息。可以旋转、缩放、切换俯瞰和日落光照；系统开启减少动态效果时，停用自动旋转与镜头过渡。</p><a id="source-link" class="btn" target="_blank" rel="noopener">查看原行程</a></dialog>
<dialog id="extras-dialog"><button data-close class="icon-btn" aria-label="关闭待安排地点"><i data-icon="close"></i></button><h2 class="head">日程之外，还可以…</h2><div class="extra-item"><strong>携程旅行 Café</strong><small>原行程待安排 · 未接入当前路线</small></div><div class="extra-item"><strong>虹桥体育公园</strong><small>原行程待安排 · 未接入当前路线</small></div><button id="return-stop" class="btn btn-primary" data-close>查看返回淞虹路地铁站的路线 · 15 分钟</button></dialog>
<script type="module" src="./ENTRY.bundle.js"></script></body></html>
