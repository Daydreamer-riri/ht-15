# The Docker image that will be used to build your app
image: hub.cloud.ctripcorp.com/devops/centos7.2:0.0.1
pages:
  script:
    - echo "Building the static site..."
    - test -f dist/presentation/index.html
    - test -f dist/walk/index.html
    - test -f dist/walk/hackathon/scene.sog
    - test -f dist/walk/two-floor/scene.sog
    - test -f dist/walk/two-floor/solids.json
    - test -f dist/walk/venue/scene.sog
    - test -f dist/walk/venue/scene.voxel.bin
    - test -f dist/walk/npc/blue-mascot.glb
    - test -f dist/walk/npc/service.json
    - test -f dist/sky-soho/index.html
    - test -f dist/route-3d/index.html
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment: production
