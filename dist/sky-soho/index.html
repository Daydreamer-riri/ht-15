<body data-trip="soho">
  <div class="page">
    <header class="header" data-rise style="--d:150">
      <a class="brand" href="../sky-soho/" aria-label="RealTrip 一日游首页">RealTrip</a>
      <a class="header-link" href="../route-3d/">北疆星球</a>
      <details class="more">
        <summary aria-label="更多页面"><i data-icon="more"></i></summary>
        <nav aria-label="更多页面">
          <a href="../presentation/">演示页面</a>
          <a href="../">基础路线</a>
          <a href="../walk/">实景漫游</a>
          <a href="../route-3d/">北疆星球</a>
        </nav>
      </details>
    </header>
    <main class="layout">
      <section class="intro" aria-labelledby="title">
        <h1 id="title" class="display" data-rise style="--d:350">携程 Hackathon<br>一日游</h1>
        <p class="lead" data-rise style="--d:550">五个真实空间，点一个就能走进去。</p>
        <p class="route-line small" data-rise style="--d:4200"><span class="route-swatch" aria-hidden="true"></span><span id="route-line" aria-live="polite"></span></p>
      </section>
      <section class="planet" aria-label="互动园区沙盘">
        <div id="scene" class="scene-host"></div>
        <p id="scene-status" class="small" role="status">正在打开你的小小世界…</p>
        <a class="btn btn-primary planet-cta" data-rise style="--d:2500" href="../walk/?scene=hackathon">走进主会场<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <div class="planet-tools" data-rise style="--d:2600">
          <div class="segmented" role="group" aria-label="沙盘视角">
            <button id="view-planet" data-view="planet" aria-pressed="true">星球</button>
            <button id="view" data-view="top" aria-pressed="false">俯瞰</button>
          </div>
          <button id="reset" class="icon-btn" aria-label="复位沙盘视角" title="复位视角"><i data-icon="rotate"></i></button>
          <p class="gesture-hint small" id="gesture-hint">拖动旋转，双指缩放</p>
        </div>
      </section>
      <section class="destinations" aria-labelledby="destinations-title">
        <h2 id="destinations-title" class="sr-only">选一站，开始探索</h2>
        <nav class="scene-grid" aria-label="选择实景空间">
          <a class="scene-card" style="--i:0" data-scene="hackathon" href="../walk/?scene=hackathon" aria-label="进入主会场实景探索"><img class="scene-photo" src="./assets/scenes/hackathon.jpg" alt="主会场的实景画面" width="960" height="720" fetchpriority="high" decoding="async"><span class="scene-copy"><strong>主会场</strong><small>灵感在这里发生</small></span><span class="scene-arrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
          <a class="scene-card" style="--i:1" data-scene="two-floor" href="../walk/?scene=two-floor" aria-label="进入健身房实景探索"><img class="scene-photo" src="./assets/scenes/two-floor-s.jpg" alt="健身房的实景画面" width="480" height="360" loading="lazy" decoding="async"><span class="scene-copy"><strong>健身房</strong><small>换个节奏，动起来</small></span><span class="scene-arrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
          <a class="scene-card" style="--i:2" data-scene="building2" href="../walk/?scene=building2" aria-label="进入会议室实景探索"><img class="scene-photo" src="./assets/scenes/building2-s.jpg" alt="会议室的实景画面" width="480" height="360" loading="lazy" decoding="async"><span class="scene-copy"><strong>会议室</strong><small>走进想法碰撞的地方</small></span><span class="scene-arrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
          <a class="scene-card" style="--i:3" data-scene="terrace" href="../walk/?scene=terrace" aria-label="进入露台实景探索"><img class="scene-photo" src="./assets/scenes/terrace-s.jpg" alt="露台的实景画面" width="480" height="360" loading="lazy" decoding="async"><span class="scene-copy"><strong>露台</strong><small>到户外，透一口气</small></span><span class="scene-arrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
          <a class="scene-card" style="--i:4" data-scene="cafeteria" href="../walk/?scene=cafeteria" aria-label="进入食堂实景探索"><img class="scene-photo" src="./assets/scenes/cafeteria-s.jpg" alt="食堂的实景画面" width="480" height="360" loading="lazy" decoding="async"><span class="scene-copy"><strong>食堂</strong><small>一起补充一点能量</small></span><span class="scene-arrow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
        </nav>
      </section>
    </main>
    <footer class="small" data-rise style="--d:3000">沙盘为示意，场景为实景采集。</footer>
  </div>
  <script type="module" src="./sky-soho.bundle.js?v=db5d807b2885"></script>
</body>
</html>
