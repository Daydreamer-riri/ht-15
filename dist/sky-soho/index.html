<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="../sky-soho/" aria-label="RealTrip 一日游首页"><span class="brand-mark" aria-hidden="true">↗</span>RealTrip</a>
      <span class="event-label">携程 HACKATHON</span>
      <details class="more">
        <summary aria-label="更多页面">···</summary>
        <nav aria-label="更多页面">
          <a href="../presentation/">演示页面 <span>↗</span></a>

      <section class="destinations" aria-labelledby="destinations-title">

          <a class="scene-card" href="../walk/?scene=hackathon" aria-label="进入主会场实景探索"><span class="scene-number">01</span><span class="scene-copy"><strong>主会场</strong><small>灵感在这里发生</small></span><span class="scene-arrow" aria-hidden="true">↗</span></a>
