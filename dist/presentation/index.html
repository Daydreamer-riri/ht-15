<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a101c">
  <meta name="description" content="一段关于旅行的对话。">
  <title>携程 Hackathon · RealTrip</title>
  <link rel="stylesheet" href="./presentation.css">
  <link rel="icon" type="image/svg+xml" href="./assets/mark.svg">
  <link rel="preload" as="image" href="./assets/sayram.jpg">
  <link rel="preload" as="image" href="./assets/baihaba.jpg">
  <link rel="preload" as="image" href="./assets/kanas.jpg">
  <link rel="preload" as="image" href="./assets/experience-qr.svg">
</head>
<body>
  <div class="chat-app">
    <header class="topbar">
      <div class="chat-title"><span class="title-dot"></span><h1>携程 Hackathon</h1></div>
      <div class="tools">
        <button id="restart" class="icon-button" title="重新开始（R）" aria-label="重新开始"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg></button>
        <button id="settings-button" class="icon-button" title="演示设置" aria-label="演示设置"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
        <button id="fullscreen-button" class="icon-button" title="全屏（F）" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
      </div>
    </header>
    <main id="conversation" class="conversation" aria-label="旅行对话" tabindex="0">
      <div class="conversation-inner">
        <div id="empty-state" class="empty-state"><span class="empty-spark" aria-hidden="true">✦</span><p>点击，开始对话。</p></div>
        <div id="messages" role="log" aria-label="聊天记录" aria-live="polite" aria-relevant="additions"></div>
      </div>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-heading"><h2 id="settings-title">演示设置</h2><button type="button" id="close-settings" class="icon-button" aria-label="关闭设置">×</button></div>
      <p>替换演示中使用的视频，设置保存在当前浏览器。</p>
      <label for="video-url">B 站视频链接或 BV 号</label><input id="video-url" name="videoUrl" type="text" autocomplete="off" spellcheck="false" required>
      <p id="settings-error" class="error-message" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="reset-video" class="quiet-button">恢复默认视频</button><button type="submit" class="next-button">保存</button></div>
    </form>
  </dialog>
  <p id="toast" class="toast" role="status" hidden></p>
  <script defer src="./presentation.js"></script>
</body>
</html>
